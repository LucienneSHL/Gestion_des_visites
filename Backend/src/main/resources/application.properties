# Nom de l'application
spring.application.name=gestion-visites-medical

# Connexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/centre_medical_db
spring.datasource.username=postgres
spring.datasource.password=1234

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Port du serveur
server.port=8081

# ============================================================
# SPRING SECURITY - Utilisateur par defaut
# ============================================================
# Sans cette config, Spring genere un mot de passe aleatoire
# a chaque demarrage, ce qui rend les tests impossibles.
spring.security.user.name=admin
spring.security.user.password=admin123

# ============================================================
# LOGS (optionnel - utile pour debug)
# ============================================================
logging.level.org.springframework.security=INFO
logging.level.com.example.demo=INFO